# Serverda:  docker compose up -d --build
# Kerak: ./.env (DOMAIN) va ./server/.env (ADMIN_PASSWORD, BOT_TOKEN). Batafsil: DEPLOY.md
services:
  server:
    build: ./server
    restart: unless-stopped
    env_file: ./server/.env
    environment:
      DATA_DIR: /data
      PORT: "4000"
      TRUST_PROXY: "2"   # caddy + web
    volumes:
      - cargo-data:/data
    # tashqariga ochilmaydi: faqat web orqali

  web:
    build:
      context: ./web
      args:
        BACKEND_URL: http://server:4000
    restart: unless-stopped
    depends_on: [server]

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [web]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?.env faylida DOMAIN ni yozing}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  cargo-data:
  caddy-data:
  caddy-config:
